name: Sync misc/*.func from upstream

on:
  schedule:
    - cron: "17 6 * * 1"   # Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Run sync
        env:
          DEST_USER: ${{ github.repository_owner }}
          DEST_REPO: ${{ github.event.repository.name }}
          DEST_REF: main
        run: |
          chmod +x scripts/sync-from-upstream.sh
          scripts/sync-from-upstream.sh

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-upstream-misc
          title: "chore: sync misc/*.func from upstream"
          commit-message: "chore: sync misc/*.func from upstream"
          body: |
            Automated weekly sync of `misc/*.func` from
            `community-scripts/ProxmoxVE@main` with the URL prefix
            rewritten to this repo.

            Review the diff carefully — upstream framework changes land here.
            After merging, run a smoke test (`bash -c "$(curl ...)"`) before
            trusting the updated framework in production.
          add-paths: misc/
          delete-branch: true
